{% extends "base.html" %}
{% block content %}
<section class="container py-5">
  <h1 class="fw-bold mb-4">Frequently asked questions</h1>
  <div class="accordion" id="faqAccordion">
    {% for q, a in faqs %}
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button {% if not loop.first %}collapsed{% endif %}" type="button"
                data-bs-toggle="collapse" data-bs-target="#faq{{ loop.index }}">
          {{ q }}
        </button>
      </h2>
      <div id="faq{{ loop.index }}" class="accordion-collapse collapse {% if loop.first %}show{% endif %}"
           data-bs-parent="#faqAccordion">
        <div class="accordion-body text-secondary">{{ a }}</div>
      </div>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
